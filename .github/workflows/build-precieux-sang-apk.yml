name: Build Precieux Sang APK

on:
  push:
    branches: [ main, "claude/**" ]
    paths:
      - "PrecieuxSang/**"
      - ".github/workflows/build-precieux-sang-apk.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build Precieux Sang Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PrecieuxSang

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Android SDK
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" 2>&1 | tail -5 || true

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/precieux_sang_build.txt; exit ${PIPESTATUS[0]}

      - name: Upload APK on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: precieux-sang-debug-apk
          path: PrecieuxSang/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: precieux-sang-build-error-log
          path: /tmp/precieux_sang_build.txt
          if-no-files-found: warn
          retention-days: 7
