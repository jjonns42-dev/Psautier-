name: Build APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Android SDK and local.properties
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          cat local.properties
          ls ${ANDROID_HOME}/build-tools/ || echo "No build-tools dir"
          ls ${ANDROID_HOME}/platforms/ || echo "No platforms dir"
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" 2>&1 | tail -5 || true

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee /tmp/build_output.txt; exit ${PIPESTATUS[0]}

      - name: Upload APK on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shhimo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: /tmp/build_output.txt
          if-no-files-found: warn
          retention-days: 7
